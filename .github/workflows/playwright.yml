name: Playwright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci

      # The runner image ships with Google Chrome, so channel:'chrome'
      # works without `playwright install`.
      - name: Tool versions
        run: node -v && npm -v && npx playwright --version && npx tsc -v

      - name: Chrome version
        run: google-chrome --version

      - name: Type-check (TS 7 vs TS 6 timing)
        run: npm run compare

      # Video recording needs Playwright's small ffmpeg build (Chrome itself is not downloaded).
      - run: npx playwright install ffmpeg

      - name: ffmpeg version
        run: ~/.cache/ms-playwright/ffmpeg-*/ffmpeg-linux -version | head -n 1

      - name: Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Package report for GitHub Pages
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

  deploy-report:
    needs: test
    if: ${{ !cancelled() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5



