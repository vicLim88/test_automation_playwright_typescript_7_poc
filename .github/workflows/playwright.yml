name: Playwright

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # The runner image ships with Google Chrome, so channel:'chrome'
      # works without `playwright install`.
      - name: Chrome version
        run: google-chrome --version

      - name: Type-check (TS 7 vs TS 6 timing)
        run: npm run compare

      # Video recording needs Playwright's small ffmpeg build (Chrome itself is not downloaded).
      - run: npx playwright install ffmpeg

      - name: Playwright tests
        run: npx playwright test

      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

